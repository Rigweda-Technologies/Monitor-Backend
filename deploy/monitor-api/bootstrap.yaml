AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap GitHub OIDC deployment access and runtime configuration for Monitor V2 in ap-south-2.

Parameters:
  ExistingGithubOidcProviderArn:
    Type: String
    Default: ''
    Description: Existing token.actions.githubusercontent.com provider ARN, if the account already has one.
  MonitorRuntimeConfigJson:
    Type: String
    NoEcho: true
    MinLength: 2
    Description: JSON object with DATABASE_URL, HRMS_BACKEND_URL, and MONITOR_SETTINGS_SECRET. Enter this only in the AWS console or a secure deployment session.

Conditions:
  CreateGithubOidcProvider: !Equals [!Ref ExistingGithubOidcProviderArn, '']

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGithubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: Monitor-Backend

  MonitorRuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: monitor-v2-development/runtime
      Description: Runtime database, HRMS verification and settings key for Monitor V2 Lambda.
      SecretString: !Ref MonitorRuntimeConfigJson
      Tags:
        - Key: Project
          Value: Monitor-Backend

  MonitorArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'monitor-v2-sam-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDeploymentArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: Monitor-Backend

  MonitorStackExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: monitor-v2-development-cfn-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MonitorV2StackResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: ManageMonitorLambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionConcurrency
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:monitor-v2-development*'
              - Sid: ManageMonitorHttpApi
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*'
              - Sid: ManageMonitorHttpApiTags
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:POST
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/arn%3A${AWS::Partition}%3Aapigateway%3A${AWS::Region}%3A%3A%2Fv2%2Fapis%2F*'
              - Sid: ManageMonitorLambdaRole
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/monitor-v2-development-runtime'
              - Sid: PassMonitorLambdaRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/monitor-v2-development-runtime'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: WriteMonitorLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/monitor-v2-development*:*'

  MonitorGithubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: monitor-v2-development-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGithubOidcProvider
                - !Ref GithubOidcProvider
                - !Ref ExistingGithubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:Rigweda-Technologies@290628100/Monitor-Backend@1433043932:ref:refs/heads/development
      Policies:
        - PolicyName: DeployMonitorV2Stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageMonitorStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/monitor-v2-development/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/monitor-v2-development'
              - Sid: ReadDeploymentRole
                Effect: Allow
                Action: iam:GetRole
                Resource: !GetAtt MonitorStackExecutionRole.Arn
              - Sid: PassStackExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt MonitorStackExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UploadDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt MonitorArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${MonitorArtifactBucket.Arn}/*'
      Tags:
        - Key: Project
          Value: Monitor-Backend

Outputs:
  GithubDeployRoleArn:
    Description: Set this as the GitHub MONITOR_AWS_DEPLOY_ROLE_ARN variable.
    Value: !GetAtt MonitorGithubDeployRole.Arn
  StackExecutionRoleArn:
    Description: Set this as the GitHub MONITOR_CFN_EXECUTION_ROLE_ARN variable.
    Value: !GetAtt MonitorStackExecutionRole.Arn
  RuntimeSecretArn:
    Description: Set this as the GitHub MONITOR_RUNTIME_SECRET_ARN variable.
    Value: !Ref MonitorRuntimeSecret
  ArtifactBucketName:
    Value: !Ref MonitorArtifactBucket
