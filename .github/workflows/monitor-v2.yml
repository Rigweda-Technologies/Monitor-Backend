name: Monitor V2 quality and deployment

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  AWS_REGION: ap-south-2
  AWS_DEFAULT_REGION: ap-south-2

jobs:
  quality:
    name: Monitor V2 quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: v2_monitor_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d v2_monitor_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      V2_MONITOR_ISOLATED_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/v2_monitor_ci
      V2_MONITOR_TEST_DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: v2/monitor-api/package-lock.json
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
      - name: Locked V2 install and Prisma generation
        run: |
          npm ci --prefix v2/monitor-api
          npm run prisma:generate --prefix v2/monitor-api
      - name: Validate Prisma schema and provision the isolated CI database
        working-directory: v2/monitor-api
        run: |
          npm run prisma:validate
          DATABASE_URL="$V2_MONITOR_ISOLATED_TEST_DATABASE_URL" npx prisma db push
      - name: Run V2 route and repository tests
        run: npm test --prefix v2/monitor-api
      - name: Test EC2 deployment recovery and receiver validation
        run: |
          bash -n deploy/monitor-api/deploy.sh deploy/monitor-api/receive.sh
          python3 -m unittest discover -s deploy/monitor-api/tests -v
      - name: Validate and build Lambda package
        run: |
          sam validate --template-file deploy/monitor-api/template.yaml
          sam build --template-file deploy/monitor-api/template.yaml --build-dir "$RUNNER_TEMP/monitor-sam-build"
      - name: Build EC2 Monitor image
        run: >-
          docker build --pull
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag monitor-v2:${{ github.sha }}
          v2/monitor-api
      - name: Save EC2 image artifact
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        run: docker save monitor-v2:${{ github.sha }} | gzip > "$RUNNER_TEMP/monitor-v2-image.tar.gz"
      - name: Upload EC2 image artifact
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitor-v2-image-${{ github.sha }}
          path: ${{ runner.temp }}/monitor-v2-image.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload built Lambda package
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitor-v2-lambda-${{ github.sha }}
          path: ${{ runner.temp }}/monitor-sam-build
          retention-days: 3
          if-no-files-found: error

  deploy-ec2:
    name: Deploy Monitor GET app to EC2
    needs: quality
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on:
      group: hrms-production-deployment
      labels: [self-hosted, linux, x64, hrms-production]
    timeout-minutes: 20
    concurrency:
      group: monitor-v2-ec2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refuse superseded development commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/development" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$latest" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: monitor-v2-image-${{ github.sha }}
          path: ${{ runner.temp }}/monitor-v2-image
      - name: Deploy validated Monitor image and verify readiness
        run: |
          archive="$RUNNER_TEMP/monitor-v2-image/monitor-v2-image.tar.gz"
          image_ref="monitor-v2:$GITHUB_SHA"
          cat "$archive" | sudo -n /usr/local/sbin/monitor-v2-ci-receive "deploy-monitor $image_ref $GITHUB_SHA"
          {
            echo "Source: $GITHUB_SHA"
            echo "Docker image reference: $image_ref"
            echo "Runner: $RUNNER_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-lambda:
    name: Deploy Monitor POST APIs to Lambda
    needs: [quality, deploy-ec2]
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: monitor-v2-lambda
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: monitor-v2-lambda-${{ github.sha }}
          path: ${{ runner.temp }}/monitor-v2-lambda
      - name: Require protected AWS deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.MONITOR_AWS_DEPLOY_ROLE_ARN }}
          CFN_EXECUTION_ROLE_ARN: ${{ vars.MONITOR_CFN_EXECUTION_ROLE_ARN }}
          ARTIFACT_BUCKET: ${{ vars.MONITOR_ARTIFACT_BUCKET }}
          RUNTIME_SECRET_ARN: ${{ vars.MONITOR_RUNTIME_SECRET_ARN }}
          CORS_ORIGINS: ${{ vars.MONITOR_CORS_ORIGINS }}
          RESERVED_CONCURRENCY: ${{ vars.MONITOR_LAMBDA_RESERVED_CONCURRENCY }}
        run: |
          for name in AWS_DEPLOY_ROLE_ARN CFN_EXECUTION_ROLE_ARN ARTIFACT_BUCKET RUNTIME_SECRET_ARN CORS_ORIGINS RESERVED_CONCURRENCY; do
            if [[ -z "${!name}" ]]; then echo "Missing GitHub variable: ${name/./_}" >&2; exit 1; fi
          done
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.MONITOR_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Lambda and method-based Monitor API Gateway routes
        env:
          CFN_EXECUTION_ROLE_ARN: ${{ vars.MONITOR_CFN_EXECUTION_ROLE_ARN }}
          ARTIFACT_BUCKET: ${{ vars.MONITOR_ARTIFACT_BUCKET }}
          RUNTIME_SECRET_ARN: ${{ vars.MONITOR_RUNTIME_SECRET_ARN }}
          CORS_ORIGINS: ${{ vars.MONITOR_CORS_ORIGINS }}
          RESERVED_CONCURRENCY: ${{ vars.MONITOR_LAMBDA_RESERVED_CONCURRENCY }}
        run: |
          sam deploy \
            --template-file "$RUNNER_TEMP/monitor-v2-lambda/template.yaml" \
            --stack-name monitor-v2-development \
            --region "$AWS_REGION" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "MonitorRuntimeSecretArn=$RUNTIME_SECRET_ARN" \
              "MonitorCorsOrigins=$CORS_ORIGINS" \
              "MonitorLambdaReservedConcurrency=$RESERVED_CONCURRENCY"
